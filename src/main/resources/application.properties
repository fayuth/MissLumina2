# =============================================================
# Miss Lumina - configuracion principal
# =============================================================
spring.application.name=miss-lumina

# Puerto de la aplicacion
server.port=${SERVER_PORT:8080}

# -------------------------------------------------------------
# PostgreSQL
# Cambia usuario y contrasena segun tu instalacion local.
# Tambien puedes definirlos con las variables de entorno
# DB_URL, DB_USERNAME y DB_PASSWORD.
# -------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/miss_lumina_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate crea/actualiza las tablas si no existen.
# El script database/miss_lumina_db.sql contiene el DDL oficial.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# -------------------------------------------------------------
# Vaadin
# -------------------------------------------------------------
vaadin.launch-browser=false
vaadin.allowed-packages=com.vaadin,com.misslumina

# -------------------------------------------------------------
# Logs: consola y archivo
# -------------------------------------------------------------
logging.level.root=INFO
logging.level.com.misslumina=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN
logging.file.name=logs/miss-lumina.log
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{50} - %msg%n

# Mensajes de error utiles en la API REST
server.error.include-message=always
