spring.application.name=miss-lumina

server.port=${SERVER_PORT:8080}

app.uploads.dir=${UPLOADS_DIR:uploads}

app.admin.nombre=${APP_ADMIN_NOMBRE:Administrador Miss Lumina}
app.admin.correo=${APP_ADMIN_CORREO:admin@misslumina.com}
app.admin.clave=${APP_ADMIN_CLAVE:Admin123*}
app.admin.telefono=${APP_ADMIN_TELEFONO:3001234567}

app.cliente.nombre=${APP_CLIENTE_NOMBRE:}
app.cliente.correo=${APP_CLIENTE_CORREO:}
app.cliente.clave=${APP_CLIENTE_CLAVE:}
app.cliente.telefono=${APP_CLIENTE_TELEFONO:}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/miss_lumina_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

vaadin.launch-browser=false
vaadin.allowed-packages=com.vaadin,com.misslumina

logging.level.root=INFO
logging.level.com.misslumina=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN
logging.file.name=logs/miss-lumina.log
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{50} - %msg%n

server.error.include-message=always
